<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>先婚后爱模拟器 · 独立测试</title>
<style>
:root{color-scheme:light;--yellow:#fee500;--ink:#191919;--wall:#dce5ed}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);-webkit-text-size-adjust:100%;text-size-adjust:100%;font-size:14px}body{min-height:100dvh;background:#e9edf1;display:grid;place-items:center;padding:10px}
.phone{width:min(100%,390px);height:min(850px,96dvh);min-height:620px;border:7px solid #202124;border-radius:36px;overflow:hidden;background:var(--wall);position:relative;box-shadow:0 16px 50px #0002;display:flex;flex-direction:column}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}.screen.active{display:flex}
.status{height:31px;flex-shrink:0;padding:7px 19px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:700;z-index:2}
.lock-screen{background:linear-gradient(160deg,#879eaf,#d5dce2 54%,#a9bdc9);color:white}
.lock-clock{padding:28px 0 0 25px;font-size:62px;font-weight:300;letter-spacing:-3px;line-height:1}.lock-date{padding-left:28px;margin-top:8px;font-size:14px}
.id-area{margin-top:auto;margin-bottom:48px;margin-left:0;margin-right:0;padding:0 26px;width:100%;max-width:none;display:grid;gap:6px}.id-area label{font-size:11px;text-shadow:0 1px 5px #0003}.id-area input{width:100%;border:1px solid #ffffffa8;border-radius:9px;background:#ffffffdc;padding:9px 11px;font-size:16px;outline:none}.id-area button,.primary{border:0;border-radius:9px;padding:9px 12px;background:var(--yellow);font-size:13px;font-weight:700;color:#191919}.lock-hint{font-size:11px;color:#fff;text-shadow:0 1px 5px #0005;min-height:14px}
.pass-screen{background:linear-gradient(160deg,#263747,#687e8e 55%,#bdcbd4);color:white;align-items:center}.pass-content{margin:auto 0;display:grid;justify-items:center;gap:17px;width:100%;padding:20px}.pass-content h2{font-size:21px;font-weight:500;margin:0}.pass-content p{font-size:12px;color:#e5edf2;margin:0}.dots{display:flex;gap:13px;margin:6px}.dot{width:11px;height:11px;border:1px solid white;border-radius:50%}.dot.filled{background:white}.keypad{display:grid;grid-template-columns:repeat(3,64px);gap:12px}.key{height:54px;border:0;border-radius:50%;background:#ffffff24;color:white;font-size:21px}.pass-error{height:16px;font-size:12px;color:#ffe1e1}
.home-screen{background:linear-gradient(160deg,#9fb6c4,#e3e9ed 58%,#9eb4c3)}.home-clock{padding:27px 22px 0;color:#fff;text-shadow:0 1px 8px #0004}.home-clock strong{display:block;font-size:49px;font-weight:300}.home-clock span{font-size:13px}.app-grid{padding:36px 25px;display:grid;grid-template-columns:repeat(4,1fr);gap:25px 14px}.app{border:0;background:transparent;color:#fff;text-shadow:0 1px 4px #0005;display:grid;justify-items:center;gap:6px;font-size:11px}.app-icon{width:48px;height:48px;min-width:48px;min-height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;font-weight:800;font-size:25px;line-height:1;text-shadow:none;box-shadow:0 3px 8px #0003;border:1px solid #ffffff55;overflow:hidden;flex-shrink:0}.app-icon::first-letter{display:inline-block}.app-icon.kkt-icon{background:#fee500;color:#292929}.app-icon.other-icon{background:linear-gradient(145deg,#fff,#e9edf2);color:#30343b}.kkt-icon{background:#fee500;color:#292929}.other-icon{background:#f7f7f7;color:#333}.dock{margin:auto 14px 12px;padding:12px;background:#ffffff70;border-radius:24px;display:flex;justify-content:space-around}
.notice{position:absolute;top:38px;left:10px;right:10px;background:#f7f7f7ed;backdrop-filter:blur(18px);border:1px solid #fff;border-radius:17px;padding:12px;box-shadow:0 8px 28px #0003;z-index:5;display:none;text-align:left;color:#191919}.notice button{width:100%;border:0;background:transparent;text-align:left;padding:0;color:inherit}.notice strong{display:block;font-size:13px;margin-bottom:4px}.notice small{display:block;color:#444;line-height:1.4}
.chat-screen{background:#abc0d1;font-size:14px;-webkit-text-size-adjust:100%;text-size-adjust:100%}.chat-top{height:56px;flex-shrink:0;background:#f8f8f8;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid #ddd}.avatar{width:36px;height:36px;border-radius:50%;background:#e5c5d0;display:grid;place-items:center;font-weight:700}.name{font-weight:700}.sub{font-size:11px;color:#777;margin-top:3px}.back{border:0;background:transparent;font-size:24px;padding:0 3px}
.messages{flex:1;min-height:0;overflow:auto;padding:14px 12px;display:flex;flex-direction:column;gap:9px}.time{text-align:center;font-size:11px;color:#4f5d69;margin:5px 0}.msg{max-width:82%;padding:8px 10px;border-radius:4px 13px 13px 13px;background:#fff;align-self:flex-start;box-shadow:0 1px 1px #0001;white-space:pre-wrap;line-height:1.35;overflow-wrap:anywhere;font-size:13px}.msg.me{align-self:flex-end;background:#fee500;border-radius:14px 4px 14px 14px}.cn{font-size:11px;color:#6b6b6b;margin-top:3px;line-height:1.3}
.composer{background:#f6f6f6;padding:8px;display:flex;gap:7px;flex-shrink:0;align-items:center}.composer input{min-width:0;flex:1;border:0;border-radius:20px;padding:8px 10px;background:white;font-size:16px;line-height:1.25;min-height:38px;max-height:42px}.composer button{border:0;border-radius:18px;padding:10px 12px;background:#fee500;font-weight:700}.candidate-panel{background:#fff;padding:2px 9px max(5px,env(safe-area-inset-bottom));border-top:1px solid #ddd;max-height:24%;overflow:auto;flex-shrink:0}.candidate-panel.collapsed{display:none}.candidate-title,.candidate-hint{display:none}.candidate{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #eee;background:white;padding:6px 3px;font-size:12px;line-height:1.25;color:#222;overflow-wrap:anywhere}.candidate .zh{display:block;color:#777;font-size:11px;line-height:1.25;margin-top:2px}.candidate.selected{background:#fff9c9}.candidate.selected:before{content:"✓ ";color:#9b8500;font-weight:700}.hidden{display:none!important}.toast{font-size:11px;color:#47634b;min-height:14px;padding:2px 10px;background:#f6f6f6}
@media(max-height:690px){.lock-clock{padding-top:20px;font-size:54px}.id-area{margin-bottom:30px}.candidate-panel{max-height:39%}.app-grid{padding-top:22px;gap:18px 12px}}
</style>
</head>
<body>
<main class="phone" aria-label="先婚后爱模拟器测试手机">
<section class="screen lock-screen active" id="lockScreen">
 <div class="status"><span>20:17</span><span>●●● ▰</span></div>
 <div class="lock-clock">20:17</div><div class="lock-date">星期二 · 10月27日</div>
 <form class="id-area" id="idForm">
  <label for="playerId">设置你的玩家 ID / 昵称</label>
  <input id="playerId" maxlength="24" autocomplete="nickname" placeholder="输入你想使用的名字" required>
  <button type="submit">确认</button>
  <div class="lock-hint" id="idHint">设置后将显示在你发送的 KKT 消息旁</div>
 </form>
 <div class="notice" id="lockNotice" style="display:none"></div>
</section>
<section class="screen pass-screen" id="passScreen">
 <div class="status"><span>20:17</span><span>●●● ▰</span></div>
 <div class="pass-content"><div style="font-size:34px">🔒</div><h2>输入密码以解锁</h2><p>输入手机密码继续</p><div class="dots" id="dots"><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div><div class="keypad" id="keypad"></div><div class="pass-error" id="passError"></div><button id="backToId" style="border:0;background:transparent;color:#fff;text-decoration:underline">返回修改 ID</button></div>
</section>
<section class="screen home-screen" id="homeScreen">
 <div class="status"><span>20:17</span><span>●●● ▰</span></div>
 <div class="home-clock"><strong>20:17</strong><span>星期二，10月27日</span></div>
 <div class="app-grid"><button class="app" id="openKkt"><span class="app-icon kkt-icon" aria-hidden="true">K</span><span>KakaoTalk</span></button><button class="app"><span class="app-icon other-icon" aria-hidden="true">▧</span><span>照片</span></button><button class="app"><span class="app-icon other-icon" aria-hidden="true">♫</span><span>音乐</span></button><button class="app"><span class="app-icon other-icon" aria-hidden="true">⚙</span><span>设置</span></button></div>
 <div class="dock"><span>📞</span><span>🌐</span><span>🎧</span><span>✉️</span></div>
 <div class="notice" id="homeNotice"><button id="openNotice"><strong>🟡 KakaoTalk · 김민정</strong><small>아직 안 잤어?</small><small style="margin-top:7px;color:#777">点击打开聊天</small></button></div>
</section>
<section class="screen chat-screen" id="chatScreen">
 <div class="status"><span>20:17</span><span>●●● ▰</span></div>
 <header class="chat-top"><button class="back" id="backHome">‹</button><div class="avatar">민</div><div><div class="name">김민정 · 金旼炡</div><div class="sub">先婚后爱 · 独立测试分支</div></div></header>
 <section class="messages" id="messages" aria-live="polite"></section>
 <div class="composer"><input id="messageInput" placeholder="输入消息…" autocomplete="off"><button id="sendButton">发送</button></div>
 <section class="candidate-panel collapsed" id="candidatePanel">
  <div id="candidates"></div>
 </section>
 <div class="toast" id="toast">点击候选回复填入输入框，或自行输入。</div>
</section>
</main>
<script>
(()=>{
const $=s=>document.querySelector(s);
const STORAGE_PREFIX="marriageSim.defaultSave.v1:"; // 独立默认自动存档命名空间，不读取或覆盖设置里的手动存档
const PLAYER_ID_KEY="foundphone.player-id.v1";
let playerId="",unlocked=false,step=0,currentView="home",pendingNotice=null;
try{playerId=(localStorage.getItem(PLAYER_ID_KEY)||"").trim();if(playerId)$("#playerId").value=playerId}catch(e){}
function personalize(text){return String(text).replaceAll("{{playerId}}",playerId||"你");}
const history=[];
const rounds=[
 {time:"20:17",npc:[["아직 안 잤어?","还没睡？"]],choices:[
 ["응, 아직 안 잤어. 무슨 일이야?","嗯，还没睡。怎么啦？"],
 ["아직. 자기 기다리고 있었지.","还没睡呀，在等你呢。"],
 ["응, 이제 자려고 했어. 자기는 아직 일하는 중이야?","嗯，正准备睡了。你还在工作吗？"],
 ["왜, 보고 싶어서 전화라도 하려고?","怎么啦，是想我了，准备给我打电话吗？"],
 ["안 잤어. 오늘은 몇 시쯤 들어와?","还没睡。你今天大概几点回来？"],
 ["응, 자기 메시지 기다렸어. 오늘 많이 바빠?","嗯，在等你的消息。今天很忙吗？"],
 ["아직 안 자. 무슨 일 있으면 나한테 바로 말해.","还没睡。有事的话就直接跟我说。"]
 ]},
 {time:"20:17",npc:[["나 오늘 집에 좀 늦게 들어갈 것 같아.","我今天可能会晚点回家。"]],choices:[
 ["몇 시쯤 들어올 것 같아?","你大概几点回来？"],
 ["알았어. 너무 무리하지 말고 천천히 마무리해.","知道啦。别太勉强，慢慢收尾。"],
 ["오늘 많이 바쁜가 보네. 끝나면 연락해 줘.","今天好像很忙呀。结束后联系我。"],
 ["기다릴 수는 있는데, 너무 늦으면 꼭 말해 줘.","我可以等你，不过太晚的话一定告诉我。"],
 ["집에 오면 바로 쉴 수 있게 미리 준비해 둘게.","我会提前准备好，让你回家就能休息。"],
 ["아쉽다. 오늘은 조금 일찍 보고 싶었는데.","有点可惜，本来今天想早点见到你。"],
 ["무슨 일인지는 괜찮아? 힘든 건 아니지?","事情还顺利吗？不是遇到什么难事了吧？"]
 ]},
 {time:"20:19",npc:[["음… 아마 열한 시쯤?","嗯……大概十一点左右？"],["아직 마무리할 게 조금 남았어.","还有一点事情要收尾。"],["너무 늦으면 먼저 자도 돼.","如果太晚的话，你可以先睡。"]],choices:[
 ["내가 뭐 준비해 놓을까? 먹고 싶은 거 있어?","要不要我提前准备点吃的？你想吃什么？"],
 ["알았어. 끝나는 대로 연락해 줘.","好，忙完就联系我。"],
 ["기다릴게. 그래도 너무 무리하지는 마.","我会等你，不过别太勉强自己。"],
 ["자기 피곤할 텐데, 집에 오면 내가 챙겨 줄게.","你应该很累了，回家我照顾你。"],
 ["먼저 자라고 해도 아마 기다릴 것 같은데?","就算你让我先睡，我大概还是会等你吧？"],
 ["열한 시쯤이면 따뜻한 거 준비해 둘 수 있겠다.","十一点左右的话，我可以提前准备点热乎的。"],
 ["응, 알겠어. 조심해서 와.","嗯，知道了。路上小心。"]
 ]},
 {time:"20:20",npc:[["음… 따뜻한 거 먹고 싶어.","嗯……我想吃点热乎的。"],["네가 해 주는 거면 아무거나 좋아.","只要是你做的，什么都好。"],["근데 너무 무리하지는 마. 나 때문에 늦게까지 기다리거나 요리하지 말고.","不过别太勉强自己。别因为我就一直等到很晚，也别特意熬夜做饭。"]],choices:[
 ["자기 먹고 싶은 걸로 준비해 줄게. 오늘 고생했으니까 집에 와서는 편하게 있어.","我给你准备你想吃的。今天辛苦了，回家以后就好好放松吧。"],
 ["따뜻한 거 준비해 둘게. 자기는 걱정 말고 일부터 마무리해.","我会准备热乎的东西，你别操心，先把工作忙完。"],
 ["알았어. 무리하지 않고 준비할게. 그래도 같이 먹고 싶어.","知道啦，我不会勉强自己的。不过还是想和你一起吃。"],
 ["우리 민정이 먹고 싶은 거라면 해 줘야지. 빨리 보고 싶다.","是我们旼炡想吃的，当然要做呀。好想快点见到你。"],
 ["걱정 마. 나도 이제 쉬면서 준비할 거야. 천천히 와.","别担心，我也会一边休息一边准备。慢慢回来就好。"],
 ["그럼 오늘은 따뜻한 국이랑 네가 좋아하는 것도 조금 준비할게.","那今天准备热汤，再做一点你喜欢的东西。"],
 ["나 때문에 걱정해 주는 거 알아. 나도 무리하지 않을게.","我知道你是在担心我。我也不会勉强自己的。"]
 ]},
 {time:"20:22",npc:[["뭐야, 이렇게 다정하게 말하면 진짜 빨리 집에 가고 싶어지잖아.","干嘛呀，你这样温柔地跟我说话，我真的会越来越想早点回家嘛。"],["오늘만 조금 더 기다려 줘. 끝나는 대로 바로 갈게.","今天再稍微等我一下嘛。我一忙完就马上回去。"],["집에 가면 {{playerId}} 옆에 붙어 있을래. 오늘은 좀 많이 안아 줘.","回家以后我要一直黏在{{playerId}}身边。今天要多抱抱我。"]],choices:[
 ["당연하지. 오늘은 내가 꼭 안아 줄게. 빨리 와, 보고 싶어.","当然啦。今天我会好好抱着你。快点回来，我想你了。"],
 ["우리 민정이 오늘 많이 힘들었구나. 집에 오면 꼭 안아 줄 테니까 조금만 더 힘내.","我们旼炡今天很辛苦吧。回家以后我一定抱抱你，再坚持一下下。"],
 ["많이 안아 달라고? 그럼 오늘은 내가 먼저 안 놔줄 거야.","想让我多抱抱你呀？那今天我可要先抱着你不放了。"],
 ["알았어, 자기야. 따뜻한 거 준비해 놓고 꼭 안아 줄게. 그러니까 조심해서 와.","知道啦，亲爱的。我会准备好热乎的东西，再好好抱抱你。所以路上要小心哦。"],
 ["나도 네가 빨리 왔으면 좋겠어. 오늘은 내 옆에 꼭 붙어 있어도 돼.","我也希望你能早点回来。今天你可以一直黏在我身边哦。"],
 ["그렇게 말하니까 나도 벌써 안아 주고 싶잖아. 일 끝나면 바로 와, 응?","你这么一说，我现在就想抱抱你了。忙完就马上回来，好不好？"],
 ["오늘 고생 많았어, 우리 자기. 집에 오면 아무 생각 말고 나한테 기대 있어.","今天辛苦啦，我的宝贝。回家以后什么都别想，就靠在我身边吧。"]
 ]}
];
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));$("#"+id).classList.add("active")}
function save(){if(!playerId)return;try{localStorage.setItem(STORAGE_PREFIX+encodeURIComponent(playerId),JSON.stringify({playerId,step,history,unlocked:true,updatedAt:Date.now()}))}catch(e){}}
function loadSave(id){try{const raw=localStorage.getItem(STORAGE_PREFIX+encodeURIComponent(id));return raw?JSON.parse(raw):null}catch(e){return null}}
$("#idForm").addEventListener("submit",e=>{e.preventDefault();playerId=$("#playerId").value.trim();if(!playerId){$("#idHint").textContent="请先输入你的 ID 或昵称";return}try{localStorage.setItem(PLAYER_ID_KEY,playerId)}catch(e){}$("#passError").textContent="";$("#idHint").textContent="ID 已确认："+playerId+"。请输入密码解锁。";show("passScreen")});
$("#backToId").addEventListener("click",()=>show("lockScreen"));
let pin="";
function drawPin(){$$("#dots .dot").forEach((d,i)=>d.classList.toggle("filled",i<pin.length))}
function $$(s){return [...document.querySelectorAll(s)]}
function makeKeypad(){const keys=["1","2","3","4","5","6","7","8","9","⌫","0","确认"];keys.forEach(k=>{const b=document.createElement("button");b.className="key";b.textContent=k;b.addEventListener("click",()=>{if(k==="⌫")pin=pin.slice(0,-1);else if(k==="确认"){if(pin==="0101"){unlocked=true;startAfterUnlock()}else{$("#passError").textContent="密码不正确，请重试。";pin=""}}else if(pin.length<4)pin+=k;drawPin()});$("#keypad").append(b)})}
function startAfterUnlock(){const old=loadSave(playerId);if(old&&old.unlocked&&Array.isArray(old.history)&&old.history.length>0){step=old.step||0;history.splice(0,history.length,...old.history);renderHistory();$("#homeNotice").style.display="none";$("#toast").textContent="已读取该 ID 的默认自动存档。";show("homeScreen");return}step=0;history.length=0;const first=rounds[0].npc[0];history.push({time:rounds[0].time,ko:first[0],zh:first[1],me:false});renderHistory();show("homeScreen");$("#homeNotice").style.display="block";$("#toast").textContent="剧情已开始：金旼炡发来了第一条消息。";save()}
makeKeypad();
function renderHistory(){const box=$("#messages");box.innerHTML="";let lastTime="";history.forEach(m=>{if(m.time&&m.time!==lastTime){const t=document.createElement("div");t.className="time";t.textContent=m.time;box.append(t);lastTime=m.time}const node=document.createElement("div");node.className="msg"+(m.me?" me":"");const ko=document.createElement("div");ko.textContent=m.ko;node.append(ko);const cn=document.createElement("div");cn.className="cn";cn.textContent=m.zh;node.append(cn);box.append(node)});box.scrollTop=box.scrollHeight}
function append(m){history.push({...m,ko:personalize(m.ko),zh:personalize(m.zh)});renderHistory();save()}
function openChat(){show("chatScreen");$("#homeNotice").style.display="none";currentView="chat";renderCandidates();$("#candidatePanel").classList.add("collapsed");}
$("#openKkt").addEventListener("click",openChat);$("#openNotice").addEventListener("click",openChat);$("#backHome").addEventListener("click",()=>{currentView="home";show("homeScreen")});
function renderCandidates(){const round=rounds[Math.min(step,rounds.length-1)];const box=$("#candidates");box.innerHTML="";round.choices.forEach(([ko,zh],i)=>{const b=document.createElement("button");b.className="candidate";b.innerHTML="";const koNode=document.createElement("span");koNode.textContent=ko;const zhNode=document.createElement("span");zhNode.className="zh";zhNode.textContent=zh;b.append(koNode,zhNode);b.addEventListener("click",()=>{$("#messageInput").value=ko;$("#messageInput").dataset.zh=zh;box.querySelectorAll(".candidate").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");$("#messageInput").focus();$("#toast").textContent="已填入输入框。点击发送才会真正发送。"});box.append(b)})}
function sendMessage(){if(window.replyBusy)return;const ko=$("#messageInput").value.trim();if(!ko){$("#toast").textContent="请先选择或输入一条回复。";return}const chosenZh=$("#messageInput").dataset.zh||"（自定义消息）";append({time:rounds[Math.min(step,rounds.length-1)].time,ko,zh:chosenZh,me:true});$("#messageInput").value="";delete $("#messageInput").dataset.zh;$("#candidatePanel").classList.add("collapsed");$("#toast").textContent="消息已发送。";if(step>=rounds.length-1){$("#toast").textContent="当前已演练到这段已确认剧情的末尾；后续剧情尚未添加。";save();return}step+=1;const next=rounds[step];window.replyBusy=true;let i=0;function deliverNext(){if(i>=next.npc.length){window.replyBusy=false;renderCandidates();save();return}const m=next.npc[i++];append({time:next.time,ko:m[0],zh:m[1],me:false});setTimeout(deliverNext,1100)}setTimeout(deliverNext,800);save()}
$("#sendButton").addEventListener("click",sendMessage);$("#messageInput").addEventListener("focus",()=>$("#candidatePanel").classList.remove("collapsed"));$("#messageInput").addEventListener("input",()=>{delete $("#messageInput").dataset.zh;$("#candidatePanel").classList.remove("collapsed")});$("#messageInput").addEventListener("keydown",e=>{if(e.key==="Enter")sendMessage()});
})();
</script>
</body>
</html>
