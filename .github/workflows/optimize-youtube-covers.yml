name: Optimize YouTube cover files

on:
  push:
    branches:
      - perf/home-app-loading-youtube-covers

permissions:
  contents: write

jobs:
  optimize-covers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install temporary image optimizer
        run: npm install --no-save --package-lock=false sharp
      - name: Compress the four YouTube cover files
        run: |
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          import { readFile, writeFile } from 'node:fs/promises';
          import { glob } from 'node:fs/promises';
          const files = [
            'public/media/youtube/JmSEjwQS-2o.jpg',
            'public/media/youtube/K3DpULg1_Vw.jpg',
            'public/media/youtube/TDxKRbGESFk.jpg',
            'public/media/youtube/Tjff1tkZDbE.jpg',
          ];
          for (const file of files) {
            const input = await readFile(file);
            const image = sharp(input);
            const meta = await image.metadata();
            const target = Math.floor(input.length * 0.67);
            let output;
            for (const quality of [78, 74, 70, 66, 62]) {
              output = await sharp(input).jpeg({
                quality, mozjpeg: true, progressive: true,
              }).toBuffer();
              if (output.length <= target) break;
            }
            if (output.length > target && meta.width && meta.width > 960) {
              output = await sharp(input)
                .resize({ width: 960, withoutEnlargement: true })
                .jpeg({ quality: 68, mozjpeg: true, progressive: true })
                .toBuffer();
            }
            await writeFile(file, output);
            console.log(file + ': ' + input.length + ' -> ' + output.length +
              ' bytes (' + (100 * (1 - output.length / input.length)).toFixed(1) +
              '% smaller; ' + meta.width + 'x' + meta.height + ')');
          }
          NODE
      - name: Commit optimized covers back to this working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/youtube/*.jpg
          if git diff --cached --quiet; then
            echo "No cover changes needed."
            exit 0
          fi
          git commit -m "Compress YouTube cover images"
          git push origin HEAD:${{ github.ref_name }}
