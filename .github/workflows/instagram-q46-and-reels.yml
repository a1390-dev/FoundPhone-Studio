name: Compress Instagram images to quality 46 and optimize four Reels

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/instagram-q46-and-reels.yml"

permissions:
  contents: write

jobs:
  compress:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Compress the 21 Instagram images to JPEG quality 46
        run: |
          python -m pip install --quiet Pillow
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          files = [
              *[Path(f"public/media/instagram/post-01/slide-{i:02d}.jpg") for i in range(1, 8)],
              *[Path(f"public/media/instagram/post-03/slide-{i:02d}.jpg") for i in range(1, 5)],
              *[Path(f"public/media/instagram/post-04/slide-{i:02d}.jpg") for i in range(1, 7)],
              *[Path(f"public/media/instagram/slide-{i:02d}.jpg") for i in range(1, 5)],
          ]
          missing = [str(p) for p in files if not p.is_file()]
          if len(files) != 21 or missing:
              raise SystemExit(f"Expected exactly 21 images; missing: {missing}")
          before = sum(p.stat().st_size for p in files)
          for path in files:
              with Image.open(path) as opened:
                  image = ImageOps.exif_transpose(opened).convert("RGB")
                  image.thumbnail((1080, 1080), Image.Resampling.LANCZOS)
                  tmp = path.with_name(path.stem + ".q46.tmp.jpg")
                  image.save(tmp, "JPEG", quality=46, optimize=True, progressive=True)
              if tmp.stat().st_size < path.stat().st_size:
                  tmp.replace(path)
              else:
                  tmp.unlink()
          after = sum(p.stat().st_size for p in files)
          print(f"21 images at JPEG quality 46: {before:,} -> {after:,} bytes; saved {max(0, before-after):,} bytes")
          PY
      - name: Recompress the four Instagram Reels used by the app
        shell: bash
        run: |
          set -euo pipefail
          videos=(
            public/media/reels/ig-reel-01.mp4
            public/media/reels/ig-reel-02.mp4
            public/media/reels/ig-reel-03.mp4
            public/media/reels/ig-reel-05.mp4
          )
          for f in "${videos[@]}"; do
            [ -f "$f" ] || { echo "Missing expected video: $f"; exit 1; }
            old_size=$(stat -c%s "$f")
            tmp="${f%.mp4}.q28.tmp.mp4"
            ffmpeg -hide_banner -loglevel error -y -i "$f" \
              -map 0:v:0 -map '0:a?' \
              -vf "scale=512:910:force_original_aspect_ratio=decrease:flags=lanczos,pad=512:910:(ow-iw)/2:(oh-ih)/2, fps=30,format=yuv420p" \
              -c:v libx264 -preset medium -crf 28 -profile:v main -level 3.1 \
              -c:a aac -b:a 80k -movflags +faststart "$tmp"
            new_size=$(stat -c%s "$tmp")
            if [ "$new_size" -lt "$old_size" ]; then
              mv "$tmp" "$f"
              echo "Compressed $f: $old_size -> $new_size bytes"
            else
              rm -f "$tmp"
              echo "Kept original because recompression was not smaller: $f ($old_size bytes)"
            fi
          done
      - name: Update cache versions and commit all optimized assets
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          path = Path("src/vendor/mymy/Apps.tsx")
          source = path.read_text()
          source, images = re.subn(r"\.jpg\?v=20261027-q56(?!-q46)", ".jpg?v=20261027-q46", source)
          if images != 21:
              raise SystemExit(f"Expected 21 q56 image references, found {images}")
          source, videos = re.subn(r"(ig-reel-(?:01|02|03|05)\.mp4)(?:\?v=[^\"']*)?", r"\1?v=20261027-q46-video", source)
          if videos != 4:
              raise SystemExit(f"Expected 4 video references, updated {videos}")
          path.write_text(source)
          workflow = Path(".github/workflows/instagram-q46-and-reels.yml")
          workflow.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/instagram/post-01/slide-*.jpg public/media/instagram/post-03/slide-*.jpg public/media/instagram/post-04/slide-*.jpg public/media/instagram/slide-*.jpg public/media/reels/ig-reel-01.mp4 public/media/reels/ig-reel-02.mp4 public/media/reels/ig-reel-03.mp4 public/media/reels/ig-reel-05.mp4 src/vendor/mymy/Apps.tsx .github/workflows/instagram-q46-and-reels.yml
          git commit -m "Compress Instagram images to quality 46 and optimize four Reels"
          git push origin HEAD:main
