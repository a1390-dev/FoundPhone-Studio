name: One-time Instagram JPEG quality 56

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-instagram-quality56.yml"

permissions:
  contents: write

jobs:
  compress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compress the 21 Instagram carousel images
        run: |
          python -m pip install --quiet Pillow
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          files = [
              *[Path(f"public/media/instagram/post-01/slide-{i:02d}.jpg") for i in range(1, 8)],
              *[Path(f"public/media/instagram/post-03/slide-{i:02d}.jpg") for i in range(1, 5)],
              *[Path(f"public/media/instagram/post-04/slide-{i:02d}.jpg") for i in range(1, 7)],
              *[Path(f"public/media/instagram/slide-{i:02d}.jpg") for i in range(1, 5)],
          ]
          if len(files) != 21 or any(not p.is_file() for p in files):
              missing = [str(p) for p in files if not p.is_file()]
              raise SystemExit(f"Expected all 21 images; missing: {missing}")

          before = 0
          after = 0
          for path in files:
              before += path.stat().st_size
              with Image.open(path) as opened:
                  image = ImageOps.exif_transpose(opened).convert("RGB")
                  image.thumbnail((1080, 1080), Image.Resampling.LANCZOS)
                  image.save(path, "JPEG", quality=56, optimize=True, progressive=True)
              after += path.stat().st_size
          print(f"Compressed {len(files)} images at JPEG quality 56; {before:,} -> {after:,} bytes ({(1-after/before)*100:.1f}% smaller)")
          PY
      - name: Update image cache versions and commit results
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          path = Path("src/vendor/mymy/Apps.tsx")
          source = path.read_text()
          updated, count = re.subn(r"\.jpg\?v=20261027(?!-q56)", ".jpg?v=20261027-q56", source)
          if count != 21:
              raise SystemExit(f"Expected to update 21 image URLs, updated {count}")
          path.write_text(updated)
          workflow = Path(".github/workflows/one-time-instagram-quality56.yml")
          workflow.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/instagram/post-01/slide-*.jpg public/media/instagram/post-03/slide-*.jpg public/media/instagram/post-04/slide-*.jpg public/media/instagram/slide-*.jpg src/vendor/mymy/Apps.tsx .github/workflows/one-time-instagram-quality56.yml
          git commit -m "Compress 21 Instagram carousel images to JPEG quality 56"
          git push origin HEAD:main
