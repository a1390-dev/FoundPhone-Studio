name: Compress Instagram post images (two additional passes)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/compress-instagram-media.yml"
  workflow_dispatch:

concurrency:
  group: compress-instagram-media-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  compress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check image tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v convert >/dev/null 2>&1; then
            timeout 180s sudo apt-get update
            timeout 180s sudo apt-get install -y imagemagick
          fi
          convert -version | head -n 1

      - name: Run two additional compression passes on all Instagram post JPGs
        shell: bash
        run: |
          set -euo pipefail
          changed=0

          # Include post images in every post folder; leave avatars and videos untouched.
          mapfile -d '' image_files < <(find public/media/instagram -type f -iname '*.jpg' ! -name 'avatar.jpg' ! -name '*.tmp-compress.jpg' -print0)
          echo "Found ${#image_files[@]} Instagram post JPG images."
          for pass in 1 2; do
            if [ "$pass" -eq 1 ]; then
              quality=68
            else
              quality=64
            fi
            echo "Starting additional compression pass $pass at JPEG quality $quality."
            index=0
            for file in "${image_files[@]}"; do
              index=$((index + 1))
              tmp="${file%.*}.tmp-compress.jpg"
              echo "Pass $pass image ${index}/${#image_files[@]}: $file"
              if ! timeout 90s convert "$file" -auto-orient -strip -resize '1080x1080>' -sampling-factor 4:2:0 -quality "$quality" "$tmp"; then
                rm -f "$tmp"
                echo "::warning::Could not compress image on pass $pass: $file"
                continue
              fi
              old_size=$(stat -c%s "$file")
              new_size=$(stat -c%s "$tmp")
              if [ "$new_size" -lt "$old_size" ]; then
                mv "$tmp" "$file"
                echo "Reduced image on pass $pass: $file ($old_size -> $new_size bytes)"
                changed=1
              else
                rm -f "$tmp"
                echo "Kept image on pass $pass (new version was not smaller): $file"
              fi
            done
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/instagram
          if [ "$changed" -eq 1 ] && ! git diff --cached --quiet; then
            git commit -m "Compress Instagram post images two more rounds"
            git push origin HEAD:main
          else
            echo "No smaller Instagram post images produced by the two additional passes."
          fi
